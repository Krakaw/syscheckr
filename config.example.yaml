# syscheckr example configuration.
#
# Prefer to generate your own? Run `syscheckr init` for an interactive wizard
# that writes a minimal config for just the checks/reporters you pick.
#
# Secrets use ${ENV} interpolation: ${VAR} expands to the environment variable,
# ${VAR:-default} falls back to a literal when unset. Run `syscheckr validate`
# to check this file, `syscheckr run` for a one-shot pass, or
# `syscheckr daemon` to run on the schedules below.

defaults:
  timeout: 10s            # per-check timeout unless a check overrides it

checks:
  - name: root-disk
    type: disk
    schedule: "*/5 * * * *"        # daemon mode only; cron syntax
    tags: [system]
    config:
      path: /
      warn_percent: 80
      crit_percent: 90

  - name: data-mount
    type: mount
    schedule: "*/5 * * * *"        # daemon mode only; cron syntax
    tags: [system]
    config:
      path: /data                  # crit if not mounted or remounted read-only
      # device: /dev/sdb1          # optional: require this source device
      # fstype: ext4               # optional: require this filesystem type
      # read_only: false           # set true for mounts meant to be read-only

  - name: cpu
    type: cpu
    schedule: "@every 1m"
    tags: [system]
    config:
      sample: 1s
      warn_percent: 85
      crit_percent: 95

  - name: memory
    type: memory
    schedule: "@every 1m"
    tags: [system]
    config:
      warn_percent: 85
      crit_percent: 95

  - name: docker-up
    type: docker_running
    schedule: "@every 1m"
    tags: [docker]

  - name: api-container
    type: docker_container
    schedule: "@every 1m"
    tags: [docker]
    config:
      name: my-api          # exact container name (without leading slash)
      # prefix: dev-api-    # OR: match all scaled replicas (dev-api-1, dev-api-2, ...);
      #                     #     all must match state, at least one must exist
      state: running
      healthy: false        # set true to also require a (healthy) status

  - name: app-errors
    type: log
    schedule: "@every 5m"
    config:
      path: /var/log/app.log
      pattern: "ERROR|FATAL"
      window: 5m            # only count lines newer than now-5m (needs leading RFC3339 timestamp)
      warn_count: 1
      crit_count: 10

  - name: health-endpoint
    type: http
    schedule: "@every 1m"
    config:
      url: https://example.com/health
      expect_status: 200
      warn_ms: 500
      crit_ms: 2000

  - name: cert-expiry
    type: command
    schedule: "@daily"
    config:
      shell: true
      command: "echo OK"     # replace with your real command
      pwd: /etc/ssl           # optional: working directory (default: process cwd)
      crit_pattern: "EXPIRED"
      warn_pattern: "expiring"

reporters:
  # Always-on console output. No min_severity means it sees every result, and
  # the log reporter is a record rather than an alert, so it repeats every run.
  - name: console
    type: log
    config:
      format: text          # or "json"
      output: stdout        # or "stderr" or a file path

  # Slack on warnings and worse.
  - name: slack-alerts
    type: slack
    min_severity: warn
    only_failing: true
    config:
      webhook_url: ${SLACK_WEBHOOK_URL}

  # Generic webhook on criticals only.
  - name: ops-webhook
    type: webhook
    min_severity: crit
    config:
      url: ${OPS_WEBHOOK_URL:-https://ops.example.com/hook}
      secret: ${OPS_WEBHOOK_SECRET}        # optional HMAC signing
      redact: false                        # true strips log samples / command output from the payload

  # Linear tickets for criticals, one per check per day while it stays crit.
  - name: linear
    type: linear
    min_severity: crit
    dedupe_window: 24h                     # default for linear; 0 = on change only
    config:
      api_key: ${LINEAR_API_KEY}
      team_id: ${LINEAR_TEAM_ID}
      redact: true                         # keep log samples / command output out of tickets

  # Prove this host is alive to another syscheckr instance running `server:`
  # below. Sent every run — if this host stops running checks, or stops running,
  # the server alerts. Routing knobs that could suppress it (only_failing,
  # min_severity above ok, repeat_alerts: false) are rejected at validation.
  # - name: home-server
  #   type: heartbeat
  #   config:
  #     url: http://mon.example.com:8080/ping
  #     key: ${HOSTNAME}                   # this host's identity on the server
  #     timeout: 5m                        # keep well above this host's schedules; max 24h
  #     token: ${SYSCHECKR_TOKEN}
  #     redact: true                       # default; results ride along with the ping
  #     http_timeout: 15s                  # request timeout for the ping itself

# Turn this instance into a heartbeat server (daemon mode only). Clients POST
# /ping with a key and their own timeout; a missed deadline becomes a crit
# result named heartbeat:<key>, routed through the reporters above. A server
# needs no checks of its own. This also serves /healthz, and --healthz wins if
# both are set.
# server:
#   listen: ":8080"
#   token: ${SYSCHECKR_TOKEN}   # without it, anyone who can reach the port can register a key
#   schedule: "@every 30s"      # deadlines are evaluated this often, so detection is one tick late

# Remembers the status each reporter was last alerted about, so a check sitting
# at warn fires once instead of every run.
state:
  path: syscheckr-state.json
